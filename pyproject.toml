[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-spy"
version = "0.1.0"
description = "Zero-config local LLM API inspector. See every API call your AI app makes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "llm-spy contributors" }]
keywords = ["llm", "openai", "anthropic", "developer-tools", "debugging", "proxy", "cli", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Debuggers",
]
dependencies = [
  "fastapi>=0.111",
  "httpx>=0.27",
  "jinja2>=3.1",
  "mitmproxy>=10.3",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.12",
  "rich>=13.7",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
llm-spy = "llmspy.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/llmspy"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/CHANGELOG.md",
  "/CODE_OF_CONDUCT.md",
  "/USERS.md",
  "/.env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
